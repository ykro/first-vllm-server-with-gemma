<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costo por millón de tokens · Bar chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #F7F6F2; color: #0F2547;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: #3B5B8C; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">

        <text x="40" y="224" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">gemini-3.8-flash, 2027</text><text x="40" y="240" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">precio de lista</text>

        <text x="470.6" y="303" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">$3.75</text>
        <text x="40" y="364" fill="#3B5B8C" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">La misma hora de GPU, a USD 1.42, rinde 7.6 veces más tokens con ocho usuarios que con uno.</text>
        <line x1="40" y1="392" x2="1000" y2="392" stroke="rgba(15,37,71,0.10)" stroke-width="0.8"/><text x="40" y="412" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <rect x="120" y="404" width="12" height="10" rx="2" fill="rgba(15,37,71,0.04)" stroke="rgba(15,37,71,0.35)" stroke-dasharray="3,2"/><text x="138" y="412" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">API administrada, modelo más capaz, solo de referencia</text>
        <text x="520" y="412" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">USD por millón de tokens de salida · precios consultados el 2026-11-10</text>
      </svg>
    </div>
  </div>
</body>
</html>
