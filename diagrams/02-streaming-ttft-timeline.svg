        <title id="ttft-title">Tiempo al primer token con y sin streaming</title>
        <desc id="ttft-desc">La misma respuesta de unos 200 tokens pedida dos veces a Gemma 4 E4B en una L4: sin streaming el texto aparece completo a los 7.8 segundos; con streaming el primer token llega a los 0.29 segundos y el resto a unos 25.5 tokens por segundo.</desc>
