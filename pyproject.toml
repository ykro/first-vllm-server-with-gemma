[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "first-vllm-server-with-gemma"
version = "0.1.0"
description = "Your first vLLM server with Gemma: an OpenAI-compatible endpoint, TTFT, tokens/s and cost"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adrián Catalán"}]
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools]
packages = ["vllm_lab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["N999", "E402"]
